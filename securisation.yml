---
- name: Sécuriser la connexion SSH sur tous les postes
  hosts: all
  become: true

  tasks:
    - name: Limiter SSH à ansible depuis srv-ansible
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config.d/10-ansible-restrict.conf
        create: true
        owner: root
        group: root
        mode: "0600"
        block: |
          AllowUsers ansible@10.81.50.62
        validate: /usr/sbin/sshd -t -f %s
      notify: Redémarrer sshd

  handlers:
    - name: Redémarrer sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted
