---
- name: Sécuriser SSH et installer bind sur tous les postes
  hosts: all
  become: true

  tasks:
    - name: Installer bind
      ansible.builtin.dnf:
        name: bind
        state: present

    - name: Activer et démarrer named
      ansible.builtin.systemd:
        name: named
        state: started
        enabled: true

    - name: Limiter SSH à ansible depuis srv-ansible
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config.d/10-ansible-restrict.conf
        create: true
        owner: root
        group: root
        mode: "0600"
        block: |
          AllowUsers ansible@10.81.50.62
        validate: /usr/sbin/sshd -t -f %s
      notify: Redémarrer sshd

    - name: Verrouiller le mot de passe de l'utilisateur ansible
      ansible.builtin.user:
        name: ansible
        password_lock: true

  handlers:
    - name: Redémarrer sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted
