---
- name: Chercher l'utilisateur d'administration
  ansible.builtin.getent:
    database: passwd
    key: "{{ admin_user_name }}"
    fail_key: false

- name: Créer l'utilisateur lors du premier passage
  when: ansible_facts['getent_passwd'][admin_user_name] is none
  block:
    - name: Générer un mot de passe aléatoire sécurisé
      ansible.builtin.set_fact:
        generated_admin_password: >-
          {{ lookup('ansible.builtin.password',
          '/dev/null length=' ~ password_length ~ ' chars=' ~ admin_password_chars) }}
      no_log: true

    - name: Créer l'utilisateur d'administration
      ansible.builtin.user:
        name: "{{ admin_user_name }}"
        comment: "{{ admin_user_comment }}"
        shell: /bin/bash
        create_home: true
        password: "{{ generated_admin_password | password_hash('sha512') }}"
        update_password: on_create
      no_log: true

- name: Donner le droit sudo avec mot de passe
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ admin_user_name }}"
    content: "{{ admin_user_name }} ALL=(ALL) ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Pousser la clef publique SSH (variable vaultée)
  ansible.posix.authorized_key:
    user: "{{ admin_user_name }}"
    key: "{{ admin_ssh_pubkey }}"
    state: present

- name: Afficher le mot de passe généré
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} : utilisateur {{ admin_user_name }},
      mot de passe {{ generated_admin_password }}
  when: generated_admin_password is defined

- name: Informer que l'utilisateur existait déjà
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} : {{ admin_user_name }} existe déjà,
      mot de passe inchangé
  when: generated_admin_password is not defined
